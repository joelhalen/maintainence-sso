# Snippet for megamtx.joelhalen.net — merge into your nginx server block.
#
#   location /api { ... }        → backend (required for bundled APK)
#   location = /download_apk     → latest debug APK
#   location / { ... }           → Vite dev or static frontend

    # API (bundled Android APK and external clients)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Latest Android test APK
    location = /download_apk {
        alias /home/debian/megamtx/maintainence-sso/releases/megamtx-latest.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="MegaMTX.apk"';
        add_header Cache-Control 'no-cache';
    }

    location = /download_apk/info {
        alias /home/debian/megamtx/maintainence-sso/releases/build-info.json;
        default_type application/json;
        add_header Cache-Control 'no-cache';
    }
